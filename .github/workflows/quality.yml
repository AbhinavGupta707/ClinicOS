name: quality

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: workspace quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package outputs
        run: npm run build:shared

      - name: Workspace check
        run: npm run check

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Bootstrap migrated synthetic database
        run: npm run db:bootstrap

      - name: Migration locking drift and rollback tests
        run: npm run db:test:migrations

      - name: Durable repository RLS and atomicity tests
        run: npm run db:test:repositories

      - name: Durable worker outbox retry and dead-letter tests
        run: npm run worker:test:persistence

      - name: API readiness dependency fault and recovery test
        run: npm run api:test:readiness

      - name: Lint workspaces
        run: npm run lint

      - name: Test workspaces
        run: npm run test

      - name: Build workspaces
        run: npm run build

      - name: Dependency audit
        run: npm run security:audit

      - name: Secret scan
        run: npm run security:secrets
